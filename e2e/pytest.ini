[pytest]
# E2E Test Framework Configuration

# Test discovery
# Default scope is the Layer-2 integration suite. Layer-3 flow tests live in
# `tests/` (added incrementally on top of green integration tests). Legacy
# full-flow tests are parked in `legacy/` and must be invoked explicitly:
#   pytest legacy/
testpaths = integration tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
norecursedirs = legacy __pycache__

# Asyncio configuration
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session

# Markers for test categorization
markers =
    smoke: Critical path tests (2 tests, 2 min timeout)
    injection: Deterministic fill injection tests (18 tests, 30s timeout)
    real_execution: Price-driven execution tests (10 tests, 10s timeout)
    resilience: Chaos/recovery tests (11 tests, 15s timeout)
    sequential: Tests that must run sequentially (connection contention)
    slow: Tests that need extended timeout

# Output options
addopts =
    -ra
    --strict-markers
    --strict-config
    --tb=short
    --disable-warnings

# Timeouts (per test)
timeout = 60
timeout_method = thread

# Logging
log_cli = false
log_cli_level = INFO
log_file = e2e_tests.log
log_file_level = DEBUG
log_format = %(asctime)s - %(name)s - %(levelname)s - %(message)s
log_date_format = %Y-%m-%d %H:%M:%S

# Test output
junit_family = xunit2
junit_logging = all
junit_duration_report = total

# Performance & Memory Optimization
minversion = 7.0

# Parallel execution (pytest-xdist)
# WARNING: Limit workers to avoid memory overload
# Each test process can consume 500MB-1GB; 4 workers = 2-4GB
# Recommended: 2-4 workers on systems with 8GB+ RAM
# Example: pytest -n 2 (use max 2 parallel workers)
# Do NOT use -n auto (unbounded parallelism causes OOM)

# Memory limits for async operations
# - Concurrent orders: max 10 (in scenario_executor)
# - Event buffer per order: max 1000 events (in EventCollector)
# - WebSocket connections: sequential or rate-limited

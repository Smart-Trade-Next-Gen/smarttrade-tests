[pytest]
# E2E Test Framework Configuration

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Asyncio configuration
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# Markers for test categorization
markers =
    smoke: Critical path tests (2 tests, 2 min timeout)
    injection: Deterministic fill injection tests (18 tests, 30s timeout)
    real_execution: Price-driven execution tests (10 tests, 10s timeout)
    resilience: Chaos/recovery tests (11 tests, 15s timeout)
    sequential: Tests that must run sequentially (connection contention)
    slow: Tests that need extended timeout

# Output options
addopts =
    -ra
    --strict-markers
    --strict-config
    --tb=short
    --disable-warnings

# Timeouts (per test)
timeout = 60
timeout_method = thread

# Logging
log_cli = false
log_cli_level = INFO
log_file = e2e_tests.log
log_file_level = DEBUG
log_format = %(asctime)s - %(name)s - %(levelname)s - %(message)s
log_date_format = %Y-%m-%d %H:%M:%S

# Test output
junit_family = xunit2
junit_logging = all
junit_duration_report = total

# Performance
minversion = 7.0

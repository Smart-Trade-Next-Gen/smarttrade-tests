[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

markers =
    smoke: quick sanity tests
    injection: deterministic injection mode
    real_execution: real execution mode
    resilience: network failures
    chaos: chaos testing

addopts =
    -v
    --tb=short
    --strict-markers

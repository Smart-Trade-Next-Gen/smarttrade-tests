name: E2E Integration Tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'e2e/**'
      - 'docker-compose.e2e.yml'
      - '.github/workflows/e2e-tests.yml'
  push:
    branches: [main]
    paths:
      - 'e2e/**'
      - 'docker-compose.e2e.yml'
      - '.github/workflows/e2e-tests.yml'
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.12'
  E2E_ENV: 'dev'
  # CI-only secrets — must match values in service containers via
  # docker-compose.e2e.yml environment block. Real secrets in GitHub
  # Secrets override the defaults below.
  JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY || 'test-jwt-secret-key-ci-only' }}
  TOKEN_ENCRYPTION_KEY: ${{ secrets.TOKEN_ENCRYPTION_KEY || 'test-encryption-key-ci-only' }}

concurrency:
  group: ${{ github.ref }}-e2e
  cancel-in-progress: true

jobs:
  e2e-integration:
    name: E2E Integration Suite
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ──────────────────────────────────────────────────────────────────
      # Checkout: all SmartTrade service repos must be siblings of
      # smarttrade-tests under the workspace root, because
      # docker-compose.e2e.yml builds with `context: ..` and references
      # each service by its repo name. Without these checkouts the
      # docker-compose build fails.
      # ──────────────────────────────────────────────────────────────────
      - name: Checkout smarttrade-tests
        uses: actions/checkout@v4
        with:
          path: smarttrade-tests

      - name: Checkout smarttrade-common
        uses: actions/checkout@v4
        with:
          repository: Smart-Trade-Next-Gen/smarttrade-common
          ref: dev
          token: ${{ secrets.SMARTTRADE_REPO_TOKEN || secrets.GITHUB_TOKEN }}
          path: smarttrade-common

      - name: Checkout authentication-service
        uses: actions/checkout@v4
        with:
          repository: Smart-Trade-Next-Gen/authentication-service
          ref: dev
          token: ${{ secrets.SMARTTRADE_REPO_TOKEN || secrets.GITHUB_TOKEN }}
          path: authentication-service

      - name: Checkout broker-adapter-service
        uses: actions/checkout@v4
        with:
          repository: Smart-Trade-Next-Gen/broker-adapter-service
          ref: dev
          token: ${{ secrets.SMARTTRADE_REPO_TOKEN || secrets.GITHUB_TOKEN }}
          path: broker-adapter-service

      - name: Checkout paper-broker-service
        uses: actions/checkout@v4
        with:
          # paper-broker-service still lives under the old `mock-service` repo
          # name on GitHub (the local checkout was renamed; the remote was not).
          # If/when the GitHub repo is renamed, update this reference.
          repository: Smart-Trade-Next-Gen/mock-service
          ref: dev
          token: ${{ secrets.SMARTTRADE_REPO_TOKEN || secrets.GITHUB_TOKEN }}
          path: paper-broker-service

      - name: Checkout market-data-service
        uses: actions/checkout@v4
        with:
          repository: Smart-Trade-Next-Gen/trade-executor-service
          ref: dev
          token: ${{ secrets.SMARTTRADE_REPO_TOKEN || secrets.GITHUB_TOKEN }}
          path: market-data-service

      - name: Checkout journal-service
        uses: actions/checkout@v4
        with:
          repository: Smart-Trade-Next-Gen/journal-service
          ref: dev
          token: ${{ secrets.SMARTTRADE_REPO_TOKEN || secrets.GITHUB_TOKEN }}
          path: journal-service

      - name: Checkout portfolio-service
        uses: actions/checkout@v4
        with:
          repository: Smart-Trade-Next-Gen/portfolio-service
          ref: dev
          token: ${{ secrets.SMARTTRADE_REPO_TOKEN || secrets.GITHUB_TOKEN }}
          path: portfolio-service

      - name: Checkout notification-service
        uses: actions/checkout@v4
        with:
          repository: Smart-Trade-Next-Gen/notification-service
          ref: dev
          token: ${{ secrets.SMARTTRADE_REPO_TOKEN || secrets.GITHUB_TOKEN }}
          path: notification-service

      # ──────────────────────────────────────────────────────────────────
      # Toolchain
      # ──────────────────────────────────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('smarttrade-tests/e2e/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r smarttrade-tests/e2e/requirements.txt

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ──────────────────────────────────────────────────────────────────
      # Service bring-up
      # ──────────────────────────────────────────────────────────────────
      - name: Build and start services
        working-directory: smarttrade-tests
        run: |
          docker-compose -f docker-compose.e2e.yml up -d --build
          docker-compose -f docker-compose.e2e.yml ps

      - name: Wait for all services healthy
        working-directory: smarttrade-tests
        timeout-minutes: 5
        run: |
          set -e
          for svc in postgres redis auth-service market-data-service paper-broker-service broker-adapter-service journal-service portfolio-service notification-service amis-core-service amis-lab-service; do
            echo "Waiting for $svc..."
            for i in $(seq 1 60); do
              status=$(docker-compose -f docker-compose.e2e.yml ps --format json $svc 2>/dev/null | python -c 'import sys,json; line=sys.stdin.read().strip().split("\n")[0]; print(json.loads(line).get("Health","") if line else "")' 2>/dev/null || echo "")
              if [ "$status" = "healthy" ]; then
                echo "$svc healthy"
                break
              fi
              sleep 5
            done
            if [ "$status" != "healthy" ]; then
              echo "::error::$svc never became healthy"
              docker-compose -f docker-compose.e2e.yml logs $svc | tail -100
              exit 1
            fi
          done

      # ──────────────────────────────────────────────────────────────────
      # The integration suite. This is the entire E2E surface — auth,
      # BAS↔PBS, MDS, Redis-stream consumers, REST APIs, WebSocket UI.
      # Single pytest invocation keeps the run coherent (one report,
      # shared session-scoped fixtures, fail-fast on the first
      # infrastructure problem).
      # ──────────────────────────────────────────────────────────────────
      - name: Run integration tests
        id: integration
        working-directory: smarttrade-tests
        run: |
          mkdir -p ../test-results
          python -m pytest e2e/integration/ \
            -v \
            --tb=short \
            --junit-xml=../test-results/integration-junit.xml \
            --html=../test-results/integration-report.html --self-contained-html

      # ──────────────────────────────────────────────────────────────────
      # Diagnostics on failure: capture service logs so the failing run
      # is debuggable from the artifact alone.
      # ──────────────────────────────────────────────────────────────────
      - name: Capture service logs on failure
        if: failure()
        working-directory: smarttrade-tests
        run: |
          mkdir -p ../service-logs
          for svc in auth-service market-data-service paper-broker-service broker-adapter-service journal-service portfolio-service notification-service postgres redis; do
            docker-compose -f docker-compose.e2e.yml logs --no-color $svc > ../service-logs/$svc.log 2>&1 || true
          done

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-integration-reports
          path: |
            test-results/integration-report.html
            test-results/integration-junit.xml
          retention-days: 30

      - name: Upload service logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-service-logs
          path: service-logs/
          retention-days: 14

      - name: Tear down services
        if: always()
        working-directory: smarttrade-tests
        run: |
          docker-compose -f docker-compose.e2e.yml down -v || true

      - name: Summarize results
        if: always()
        run: |
          echo "## E2E Integration Test Summary" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.integration.outcome }}" = "success" ]; then
            echo "✅ All integration tests passed." >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Integration tests failed. Service logs uploaded as artifact \`e2e-service-logs\`." >> $GITHUB_STEP_SUMMARY
          fi
